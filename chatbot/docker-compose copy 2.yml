# docker-compose.yml (Compose v2: sin clave 'version')

volumes:
  db_storage:
  n8n_storage:
  qdrant_data:
  ollama_data:

services:
  postgres:
    image: postgres:16
    restart: always
    # Carga variables desde .env (en la misma carpeta)
    env_file:
      - .env
    # Si quieres forzar que existan, puedes repetirlas aquí; con env_file basta.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_storage:/var/lib/postgresql/data
      # IMPORTANTE en Windows: asegúrate que init-data.sh tenga finales de línea LF y File Sharing habilitado.
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh:ro
    ports:
      - "5433:5432"  # host:container
    healthcheck:
      # Dentro del contenedor, localhost es Postgres mismo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_NON_ROOT_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_NON_ROOT_PASSWORD}

      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    ports:
      - "5678:5678"
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./data:/home/node
    depends_on:
      postgres:
        condition: service_healthy


  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QDRANT__SERVICE__API_KEY: ${API_KEY_QDRANT}
      QDRANT__LOG_LEVEL: INFO
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"
    ports:
      - "6333:6333"  # REST
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
      - ./config:/qdrant/config
    healthcheck:
      # BusyBox 'wget' suele estar disponible; si no, cambia a curl si tu imagen lo trae.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6333/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama1
    pull_policy: always
    tty: true
    restart: always
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_HOST: 0.0.0.0
    ports:
      - "7869:11434"
    volumes:
      - .:/code
      - ollama_data:/root/.ollama

  translator:
    build: ./api
    restart: unless-stopped
    ports:
      - "8001:8001"
    # Si depende de Postgres o Qdrant, puedes encadenar:
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
